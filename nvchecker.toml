# nvchecker.toml — upstream version checker for home:itachi_re:craft-apps
#
# Every app ships as TWO OBS packages (the GUI app and its `-cli` twin) that are
# built from the SAME upstream release, so each upstream repo appears twice:
# once as <app> and once as <app>-cli. Both get triggered on a new release.
#
# Version source: GitHub *Releases* (`use_latest_release`). That is deliberate:
#   - every storytold/* repo publishes a Release per tag, so this equals "newest tag"
#   - drafts and pre-releases are ignored, which matters for solidcraft (it
#     publishes -rc.N and -nightly.* releases that must NOT trigger builds)
#
# Docs: https://nvchecker.readthedocs.io/en/latest/usage.html
#
# ── How nvchecker uses this file ─────────────────────────────────────────────
# 1. Reads KNOWN versions from   versions.json     (committed to git)
# 2. Checks UPSTREAM versions,   writes to         versions_new.json
# 3. trigger_obs.py diffs old vs new, fires OBS API for changed packages
# 4. GitHub Actions commits updated versions.json back to the repo
# ─────────────────────────────────────────────────────────────────────────────

[__config__]
oldver  = "versions.json"
newver  = "versions_new.json"
keyfile = ".nvchecker_keyfile.toml"
max_concurrency = 3


